/* =========================================================
   壹号食志 · 朋友圈文案工坊
   Warm editorial UI · 2026
   ========================================================= */

:root {
  --ink: #211b15;
  --ink-2: #3c342b;
  --ink-3: #6f6255;
  --muted: #958674;
  --paper: #f5f0e7;
  --paper-2: #ede4d6;
  --card: #fffdf8;
  --card-2: #fbf6ed;
  --line: #e4d8c7;
  --line-strong: #d4c3ad;
  --accent: #b85c34;
  --accent-deep: #8f3f1e;
  --accent-soft: #f3e2d4;
  --gold: #b88a4f;
  --gold-soft: #ecdfc7;
  --green: #0eaa63;
  --green-dark: #0a8a50;
  --wechat-blue: #576b95;
  --danger: #b43a2d;
  --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", "STSong", "SimSun", serif;
  --sans: "PingFang SC", "HarmonyOS Sans SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --shadow-sm: 0 1px 2px rgba(55, 37, 19, .04), 0 6px 18px rgba(55, 37, 19, .04);
  --shadow-md: 0 18px 52px rgba(46, 29, 13, .12);
  --radius: 18px;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  min-width: 320px;
  color: var(--ink);
  background: var(--paper);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: .35;
  background-image: radial-gradient(rgba(63, 44, 24, .12) .45px, transparent .45px);
  background-size: 4px 4px;
  mix-blend-mode: multiply;
}

::selection { background: #e8c7ad; color: #2a1b12; }

button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid #b85c34;
  outline-offset: 2px;
}
img { max-width: 100%; display: block; }
a { color: inherit; }
h1, h2, h3, h4, p { margin: 0; }
em { font-style: normal; }

.svg-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

.icon {
  width: 18px;
  height: 18px;
  flex: 0 0 auto;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* ---------- App shell ---------- */
.app-shell {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 238px minmax(0, 1fr);
  min-height: 100vh;
}

.main-shell { min-width: 0; display: flex; flex-direction: column; }

/* ---------- Sidebar ---------- */
.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 26px 18px 20px;
  color: #efe5d5;
  background:
    radial-gradient(120% 80% at -10% -10%, rgba(190, 140, 81, .18), transparent 55%),
    radial-gradient(80% 60% at 120% 110%, rgba(184, 92, 52, .14), transparent 60%),
    #1e1813;
  overflow: hidden;
}

.sidebar::before {
  content: "";
  position: absolute;
  inset: 0;
  opacity: .16;
  pointer-events: none;
  background-image: radial-gradient(rgba(255, 245, 225, .6) .4px, transparent .4px);
  background-size: 5px 5px;
}

.sidebar > * { position: relative; z-index: 1; }

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 2px 6px 25px;
}

.brand-mark {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  border: 1px solid rgba(215, 177, 116, .7);
  color: #f0d7a7;
  font-family: var(--serif);
  font-size: 23px;
  line-height: 1;
  border-radius: 50%;
  background: rgba(255, 246, 231, .03);
  box-shadow: inset 0 0 0 4px rgba(255, 246, 231, .025);
}

.brand-text { min-width: 0; }
.brand-text strong {
  display: block;
  font-family: var(--serif);
  font-weight: 600;
  font-size: 19px;
  letter-spacing: .06em;
  color: #f3e7d5;
}
.brand-text span {
  display: block;
  margin-top: 1px;
  font-size: 8.5px;
  letter-spacing: .26em;
  color: rgba(236, 218, 189, .45);
}

.nav {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-top: 8px;
  border-top: 1px solid rgba(240, 220, 190, .1);
}

.nav-item {
  position: relative;
  width: 100%;
  min-height: 48px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 12px;
  border: 0;
  border-radius: 10px;
  color: rgba(240, 228, 209, .58);
  background: transparent;
  text-align: left;
  transition: background .18s ease, color .18s ease;
}
.nav-item .icon { width: 19px; height: 19px; }
.nav-item span { flex: 1; font-size: 13.5px; letter-spacing: .03em; }
.nav-item em {
  font-style: normal;
  font-size: 9.5px;
  letter-spacing: .12em;
  color: rgba(235, 215, 183, .3);
}
.nav-item:hover { color: #f6ead8; background: rgba(255, 245, 229, .055); }
.nav-item.active {
  color: #fff8ee;
  background: linear-gradient(90deg, rgba(184, 92, 52, .32), rgba(184, 92, 52, .08));
  box-shadow: inset 2px 0 0 #c88059;
}
.nav-item.active em { color: rgba(255, 233, 203, .65); }
.nav-count {
  min-width: 19px;
  height: 19px;
  padding: 0 5px;
  display: inline-grid;
  place-items: center;
  border-radius: 999px;
  background: rgba(255, 244, 227, .12);
  color: #eadcc5;
  font-size: 10px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.sidebar-note {
  margin-top: auto;
  padding: 16px;
  border: 1px solid rgba(210, 175, 122, .18);
  border-radius: 14px;
  background:
    linear-gradient(145deg, rgba(207, 161, 97, .11), rgba(255, 255, 255, .015));
}
.sidebar-note .eyebrow { color: rgba(228, 191, 137, .7); font-size: 9px; }
.sidebar-note p {
  margin-top: 8px;
  color: rgba(244, 232, 213, .76);
  font-family: var(--serif);
  font-size: 13.5px;
  line-height: 1.8;
}
.sidebar-note button {
  margin-top: 12px;
  padding: 0;
  border: 0;
  color: #d6ad74;
  background: none;
  font-size: 11px;
  letter-spacing: .05em;
}
.sidebar-note button:hover { color: #f0ce9d; }

.sidebar-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 18px 4px 0;
  font-size: 9.5px;
  color: rgba(237, 221, 196, .34);
  letter-spacing: .06em;
}
.status-dot { display: inline-flex; align-items: center; gap: 6px; }
.status-dot i {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: #77b889;
  box-shadow: 0 0 0 3px rgba(119, 184, 137, .12);
}

/* ---------- Topbar ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  min-height: 70px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 0 38px;
  background: rgba(245, 240, 231, .84);
  border-bottom: 1px solid rgba(214, 199, 178, .6);
  backdrop-filter: blur(18px) saturate(130%);
}

.crumb {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 11.5px;
  letter-spacing: .06em;
}
.crumb .sep { color: #c4b29c; }
.crumb strong { color: var(--ink-2); font-weight: 500; }
.topbar-brand { display: none; align-items: center; gap: 8px; font-family: var(--serif); font-size: 17px; }
.topbar-brand .brand-mark { width: 32px; height: 32px; font-size: 17px; border-color: var(--line-strong); color: var(--accent); }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.engine-pill {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 32px;
  padding: 0 12px;
  border: 1px solid #ded1bd;
  border-radius: 999px;
  background: rgba(255, 252, 246, .66);
  color: #756758;
  font-size: 10.5px;
  letter-spacing: .04em;
}
.engine-pill i {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 0 3px rgba(14, 170, 99, .1);
}
.icon-btn {
  width: 36px;
  height: 36px;
  display: inline-grid;
  place-items: center;
  border: 1px solid transparent;
  border-radius: 50%;
  background: transparent;
  color: var(--ink-3);
  transition: background .18s, border-color .18s;
}
.icon-btn:hover { background: rgba(255, 252, 246, .8); border-color: var(--line); }
.avatar-mini {
  width: 34px; height: 34px;
  display: grid; place-items: center;
  border-radius: 50%;
  background: #241d16;
  color: #f0d5a6;
  font-family: var(--serif);
  font-size: 16px;
  box-shadow: inset 0 0 0 1px rgba(220, 184, 127, .35);
}

/* ---------- View / page basics ---------- */
.view {
  width: 100%;
  max-width: 1560px;
  margin: 0 auto;
  padding: 34px 38px 70px;
}

.eyebrow {
  display: inline-block;
  color: var(--accent);
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: .2em;
  text-transform: uppercase;
}

.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 28px;
  margin-bottom: 30px;
}
.page-head h1 {
  margin-top: 8px;
  font-family: var(--serif);
  font-size: clamp(30px, 3vw, 42px);
  font-weight: 500;
  letter-spacing: -.025em;
  line-height: 1.18;
}
.page-head p {
  max-width: 560px;
  margin-top: 10px;
  color: var(--ink-3);
  font-size: 13px;
  line-height: 1.8;
}
.page-head-actions { display: flex; flex-wrap: wrap; gap: 9px; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 39px;
  padding: 0 17px;
  border: 1px solid var(--line-strong);
  border-radius: 9px;
  background: var(--card);
  color: var(--ink-2);
  font-size: 12px;
  letter-spacing: .02em;
  white-space: nowrap;
  transition: transform .18s, box-shadow .18s, background .18s, border-color .18s;
}
.btn .icon { width: 16px; height: 16px; }
.btn:hover { border-color: #bba98f; box-shadow: var(--shadow-sm); transform: translateY(-1px); }
.btn:active { transform: translateY(0); }
.btn-primary {
  border-color: #2a2119;
  background: #241d16;
  color: #fff7ea;
}
.btn-primary:hover { background: #35291f; border-color: #35291f; }
.btn-accent {
  border-color: var(--accent-deep);
  background: linear-gradient(135deg, #c06439, #9d4524);
  color: #fff8ee;
  box-shadow: 0 8px 20px rgba(155, 68, 35, .2);
}
.btn-accent:hover { background: linear-gradient(135deg, #c96b3e, #a84b28); border-color: #a84b28; }
.btn-ghost { border-color: transparent; background: transparent; color: var(--ink-3); }
.btn-ghost:hover { background: rgba(255, 252, 246, .8); border-color: var(--line); }
.btn-sm { min-height: 31px; padding: 0 11px; font-size: 11px; border-radius: 7px; }
.btn-sm .icon { width: 14px; height: 14px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.link-btn {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--accent);
  font-size: 11px;
}
.link-btn:hover { color: var(--accent-deep); }
.link-btn .icon { width: 13px; height: 13px; }

/* ---------- Studio hero ---------- */
.studio-hero {
  position: relative;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 40px;
  margin-bottom: 32px;
  padding-bottom: 28px;
  border-bottom: 1px solid var(--line);
}
.studio-hero::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: -1px;
  width: 92px;
  height: 1px;
  background: var(--accent);
}
.hero-copy h1 {
  margin-top: 9px;
  max-width: 760px;
  font-family: var(--serif);
  font-size: clamp(34px, 3.5vw, 54px);
  font-weight: 500;
  line-height: 1.12;
  letter-spacing: -.035em;
}
.hero-copy h1 em {
  position: relative;
  color: var(--accent);
  white-space: nowrap;
}
.hero-copy h1 em::after {
  content: "";
  position: absolute;
  left: 0;
  right: 2px;
  bottom: 5px;
  height: 7px;
  background: rgba(184, 92, 52, .13);
  z-index: -1;
  border-radius: 1px;
}
.hero-side {
  width: min(340px, 30vw);
  flex: 0 0 auto;
  padding-bottom: 4px;
}
.hero-side > p {
  color: var(--ink-3);
  font-size: 12.5px;
  line-height: 1.85;
}
.hero-stats {
  display: flex;
  gap: 24px;
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
}
.hero-stats div { display: flex; align-items: baseline; gap: 5px; }
.hero-stats strong { font-family: var(--serif); font-size: 24px; font-weight: 500; line-height: 1; }
.hero-stats span { color: var(--muted); font-size: 9.5px; letter-spacing: .05em; }

/* ---------- Workspace ---------- */
.workspace {
  display: grid;
  grid-template-columns: 330px minmax(340px, 390px) minmax(0, 1fr);
  gap: 22px;
  align-items: start;
}

.panel {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--card);
  box-shadow: var(--shadow-sm);
}

/* ---------- Controls ---------- */
.controls { padding: 20px 19px 18px; }
.control-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line);
}
.control-head h2 {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: 500;
  letter-spacing: .01em;
}
.control-head span { color: var(--muted); font-size: 9px; letter-spacing: .16em; }
.step { padding-top: 19px; margin-top: 19px; border-top: 1px solid #ece2d3; }
.step:first-of-type { padding-top: 17px; margin-top: 0; border-top: 0; }
.step-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.step-no {
  width: 21px; height: 21px;
  display: inline-grid; place-items: center;
  border: 1px solid #d8c7b2;
  border-radius: 50%;
  color: var(--accent);
  font-family: var(--serif);
  font-size: 10px;
  line-height: 1;
}
.step-head h3 { font-size: 12.5px; font-weight: 600; letter-spacing: .04em; }
.step-head .step-hint { margin-left: auto; color: var(--muted); font-size: 9.5px; letter-spacing: .02em; }

.product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
.product-option {
  position: relative;
  display: flex;
  align-items: center;
  gap: 9px;
  min-height: 58px;
  padding: 7px;
  border: 1px solid #e8ddcd;
  border-radius: 10px;
  background: #fcf8f0;
  text-align: left;
  transition: border-color .18s, background .18s, box-shadow .18s;
}
.product-option:hover { border-color: #cebda6; background: #fffdf8; }
.product-option.active {
  border-color: #bd7554;
  background: #fffaf3;
  box-shadow: 0 0 0 2px rgba(184, 92, 52, .09);
}
.product-option img {
  width: 42px;
  height: 42px;
  flex: 0 0 auto;
  object-fit: cover;
  border-radius: 8px;
  background: #eadcc9;
}
.product-option-body { min-width: 0; }
.product-option strong {
  display: block;
  overflow: hidden;
  color: var(--ink-2);
  font-size: 10.5px;
  font-weight: 600;
  line-height: 1.4;
  white-space: nowrap;
  text-overflow: ellipsis;
}
.product-option small { display: block; margin-top: 1px; color: var(--muted); font-size: 8.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.product-option .tick {
  position: absolute;
  top: 5px;
  right: 5px;
  width: 14px; height: 14px;
  display: none;
  place-items: center;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
}
.product-option .tick .icon { width: 9px; height: 9px; stroke-width: 2.5; }
.product-option.active .tick { display: grid; }

.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.add-product-link {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-top: 9px;
  color: #9b7750;
  font-size: 9.5px;
}
.add-product-link:hover { color: var(--accent); }
.add-product-link .icon { width: 12px; height: 12px; }
.point-chip, .scene-chip, .persona-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 29px;
  padding: 0 10px;
  border: 1px solid #e1d4c2;
  border-radius: 999px;
  background: #fcf8f1;
  color: #65594c;
  font-size: 10.5px;
  letter-spacing: .01em;
  transition: all .16s ease;
}
.point-chip::before {
  content: "";
  width: 5px; height: 5px;
  border-radius: 50%;
  border: 1px solid #bba88f;
  transition: all .16s ease;
}
.point-chip:hover, .scene-chip:hover, .persona-chip:hover { border-color: #c5ad90; color: var(--ink); }
.point-chip.active {
  border-color: #2a2119;
  background: #2a2119;
  color: #fff7ea;
}
.point-chip.active::before { background: #d6a46c; border-color: #d6a46c; }
.scene-chip.active, .persona-chip.active {
  border-color: var(--accent);
  background: var(--accent-soft);
  color: var(--accent-deep);
}
.point-chip:disabled { opacity: .38; pointer-events: none; }

.segment {
  display: flex;
  gap: 3px;
  padding: 3px;
  border: 1px solid #e7dccb;
  border-radius: 9px;
  background: #f5ede1;
}
.segment button {
  flex: 1;
  min-height: 29px;
  padding: 0 6px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--muted);
  font-size: 10px;
  transition: all .16s;
}
.segment button:hover { color: var(--ink-2); }
.segment button.active {
  background: #fffdf8;
  color: var(--ink);
  box-shadow: 0 1px 3px rgba(57, 39, 20, .12);
  font-weight: 600;
}
.length-hint { margin-top: 6px; color: var(--muted); font-size: 9px; text-align: right; letter-spacing: .04em; }

.switch-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 13px; }
.switch {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 33px;
  padding: 0 9px;
  border: 1px solid #e8ddcd;
  border-radius: 8px;
  background: #fcf8f1;
  color: #6b5e50;
  font-size: 10px;
  text-align: left;
}
.switch .track {
  position: relative;
  width: 27px;
  height: 15px;
  flex: 0 0 auto;
  border-radius: 999px;
  background: #d9cbb8;
  transition: background .18s;
}
.switch .track::after {
  content: "";
  position: absolute;
  top: 2px; left: 2px;

  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .15);

}

.field-label { display: flex; align-items: center; justify-content: space-between; margin: 13px 0 6px; color: var(--muted); font-size: 9.5px; letter-spacing: .03em; }

.note-input {

}

.note-input:focus, .select-wrap select:focus { border-color: #c79874; box-shadow: 0 0 0 3px rgba(184, 92, 52, .08); }

.generate-btn {

  border-radius: 10px;

  font-size: 13px;
  letter-spacing: .08em;
  box-shadow: 0 10px 26px rgba(148, 66, 33, .22);
  overflow: hidden;

}
.generate-btn::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(100deg, transparent 20%, rgba(255, 246, 230, .16) 48%, transparent 75%);
  transform: translateX(-110%);
  transition: transform .55s ease;
}
.generate-btn:hover { transform: translateY(-1px); box-shadow: 0 13px 30px rgba(148, 66, 33, .28); }
.generate-btn:hover::after { transform: translateX(110%); }
.generate-btn .icon { width: 17px; height: 17px; }
.generate-btn small { opacity: .64; font-size: 9px; letter-spacing: .06em; }
.generate-btn .kbd {
  margin-left: 2px;
  padding: 2px 5px;
  border: 1px solid rgba(255, 247, 234, .24);
  border-radius: 4px;
  font-size: 8px;
  letter-spacing: .06em;
  opacity: .55;
}

/* ---------- Preview column ---------- */
.preview-column { position: sticky; top: 92px; min-width: 0; }
.preview-head {

}

.phone-frame {
  width: 100%;

  padding: 9px;
  border: 1px solid #3d3228;
  border-radius: 38px;

.phone-screen {

.phone-status {

.phone-status .signal-bars i { width: 1.8px; background: #222; border-radius: 1px; }
.phone-status .signal-bars i:nth-child(1) { height: 3px; }
.phone-status .signal-bars i:nth-child(2) { height: 5px; }
.phone-status .signal-bars i:nth-child(3) { height: 7px; }
.phone-status .battery {

.phone-status .battery::before { content: ""; position: absolute; right: -3px; top: 2px; width: 1.5px; height: 3px; background: #222; border-radius: 0 1px 1px 0; }

.moments-nav {
  height: 42px;

  align-items: center;

  padding: 0 16px;
  flex: 0 0 auto;
  border-bottom: 1px solid #f0f0f0;

}
.moments-nav strong { font-size: 14px; font-weight: 500; }
.moments-nav .nav-icon { width: 21px; height: 21px; color: #222; }
.moments-nav .nav-left { width: 30px; }
.moments-nav .nav-right { width: 30px; text-align: right; }

.phone-scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
.phone-scroll::-webkit-scrollbar { display: none; }

.moments-cover {
  position: relative;
  height: 104px;
  overflow: hidden;
  background: #2c241c;
}
.moments-cover img { width: 100%; height: 100%; object-fit: cover; }
.moments-cover::after {
  content: "";
  position: absolute;

}
.moments-avatar {
  width: 52px;
  height: 52px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  margin-top: -24px;
  border: 3px solid #fff;

  background:
    radial-gradient(circle at 35% 25%, rgba(230, 193, 135, .22), transparent 55%),
    #211a14;

.moment {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr);
  gap: 9px;
  padding: 11px 16px 16px;
  border-bottom: 8px solid #f7f7f7;
}
.moment-avatar {
  width: 34px; height: 34px;
  display: grid; place-items: center;
  border-radius: 5px;
  background: #2a2119;
  color: #efd2a1;
  font-family: var(--serif);
  font-size: 16px;
}
.moment-body { min-width: 0; }
.moment-name { color: var(--wechat-blue); font-size: 12px; font-weight: 600; line-height: 1.4; }
.moment-text {
  margin-top: 4px;
  max-height: 214px;
  overflow-y: auto;
  color: #252525;
  font-size: 11.5px;
  line-height: 1.72;
  white-space: pre-wrap;
  word-break: break-word;
  scrollbar-width: thin;
  scrollbar-color: #ddd transparent;
}
.moment-text::-webkit-scrollbar { width: 3px; }
.moment-text::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }
.moment-text .tag { color: var(--wechat-blue); }
.moment-text .group-title { color: #252525; }

.moment-media { margin-top: 8px; }
.moment-grid { display: grid; gap: 3px; }
.moment-grid.n-1 { width: 74%; grid-template-columns: 1fr; }
.moment-grid.n-1 .grid-item { aspect-ratio: 4 / 3; }
.moment-grid.n-2 { width: 72%; grid-template-columns: repeat(2, 1fr); }
.moment-grid.n-3 { grid-template-columns: repeat(3, 1fr); }
.moment-grid.n-4 { width: 72%; grid-template-columns: repeat(2, 1fr); }
.moment-grid.n-5, .moment-grid.n-6, .moment-grid.n-7, .moment-grid.n-8, .moment-grid.n-9 { grid-template-columns: repeat(3, 1fr); }
.grid-item {
  position: relative;
  aspect-ratio: 1;
  overflow: hidden;
  background: #eee8dd;
}
.grid-item:first-child { border-top-left-radius: 3px; }
.grid-item img { width: 100%; height: 100%; object-fit: cover; }
.grid-item.more::after {
  content: "+" attr(data-more);
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: rgba(24, 18, 12, .48);
  color: #fff;
  font-size: 13px;
  font-weight: 500;
}
.moment-media-empty {
  display: grid;
  place-items: center;
  width: 100%;
  min-height: 101px;
  border: 1px dashed #ddd2c1;
  border-radius: 4px;
  background: #faf7f0;
  color: #b2a18c;
  font-size: 9px;
  text-align: center;
  line-height: 1.7;
}
.moment-media-empty .icon { width: 19px; height: 19px; margin: 0 auto 3px; color: #c6b398; }

.moment-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: 9px;
  color: #b3b3b3;
  font-size: 8.5px;
}

.moment-actions {
  display: flex;
  align-items: center;
  gap: 13px;
  margin-top: 8px;
  padding: 6px 8px;
  border-radius: 4px;
  background: #f7f7f7;
  color: #7b7b7b;
  font-size: 8.5px;
}
.moment-actions span { display: inline-flex; align-items: center; gap: 3px; }
.moment-actions .icon { width: 11px; height: 11px; color: #9b9b9b; }
.moment-actions .spacer { flex: 1; }
.moment-actions .like-icon { color: #e06a72; }
.phone-end {
  display: flex;
  justify-content: center;
  padding: 12px 0 15px;
  color: #c4c4c4;
  font-size: 8px;
  letter-spacing: .16em;
}

.preview-note {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  max-width: 382px;
  margin: 11px auto 0;
  padding: 0 4px;
  color: var(--muted);

}

/* image strip */
.media-block {
  max-width: 382px;
  margin: 14px auto 0;
  padding: 13px 14px 12px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: rgba(255, 253, 248, .78);
}
.media-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 9px; }
.media-head strong { font-size: 10.5px; font-weight: 600; letter-spacing: .04em; }
.media-head span { color: var(--muted); font-size: 9px; }
.thumb-row { display: flex; align-items: center; gap: 7px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.thumb-row::-webkit-scrollbar { display: none; }
.thumb {
  position: relative;
  width: 51px;
  height: 51px;
  flex: 0 0 auto;
  overflow: hidden;
  border: 1px solid #e3d6c4;
  border-radius: 7px;
  background: #eee4d5;
}
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb:first-child { border-color: #c98b68; box-shadow: 0 0 0 2px rgba(184, 92, 52, .13); }
.thumb-badge {
  position: absolute;
  left: 3px;
  bottom: 2px;
  padding: 0 3px;
  border-radius: 2px;
  background: rgba(32, 24, 17, .68);
  color: #fff;
  font-size: 6.5px;
  line-height: 1.6;
  letter-spacing: .04em;
}
.thumb-remove {
  position: absolute;
  top: 2px;
  right: 2px;
  width: 14px;
  height: 14px;
  display: grid;
  place-items: center;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: rgba(34, 26, 18, .64);
  color: #fff;
  opacity: 0;
  transition: opacity .16s;
}
.thumb:hover .thumb-remove { opacity: 1; }
.thumb-remove .icon { width: 9px; height: 9px; stroke-width: 2; }
.thumb-add {
  width: 51px;
  height: 51px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  border: 1px dashed #cbb9a2;
  border-radius: 7px;
  background: transparent;
  color: #a38d73;
  transition: all .16s;
}
.thumb-add:hover { border-color: var(--accent); color: var(--accent); background: rgba(184, 92, 52, .04); }
.thumb-add .icon { width: 17px; height: 17px; }
.media-hint { margin-top: 9px; color: #9f8d79; font-size: 8.5px; line-height: 1.6; }

/* ---------- Results ---------- */
.results-column { min-width: 0; }
.results-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 12px;
  padding: 0 2px;
}
.results-head h2 { margin-top: 5px; font-family: var(--serif); font-size: 22px; font-weight: 500; }

}
.copy-card:hover { border-color: #cfbca5; box-shadow: var(--shadow-sm); background: #fffdf8; }
.copy-card.active {

.copy-card::before {
  content: "";
  position: absolute;

  width: 3px;
  height: 3px;

.copy-head { display: flex; align-items: flex-start; gap: 9px; }

.copy-chars {

  border-radius: 4px;
  background: #f4ede2;

  font-variant-numeric: tabular-nums;
}
.copy-body {
  margin-top: 10px;
  color: #41382e;
  font-size: 11.8px;
  line-height: 1.8;
  letter-spacing: .005em;
  white-space: pre-wrap;

  -webkit-line-clamp: 7;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.copy-card.active .copy-body { display: block; }
.copy-card .copy-body .tag { color: var(--wechat-blue); }
.copy-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 11px;
  padding-top: 10px;
  border-top: 1px solid #f0e7da;
}
.copy-foot-info { display: flex; align-items: center; gap: 5px; color: #a1907c; font-size: 8.5px; white-space: nowrap; }
.copy-foot-info .icon { width: 11px; height: 11px; }
.copy-btns { display: flex; align-items: center; gap: 5px; }
.copy-btn {

.compliance-note {

.results-empty {
  padding: 44px 24px;

  gap: 8px;
  margin-top: 15px;
  padding: 11px 13px;
  border: 1px solid #d8bfa2;
  border-radius: 9px;
  background: rgba(255, 252, 246, .55);
  color: #76573a;

.import-head { align-items: flex-end; }

.import-dropzone .btn { margin-top: 18px; }
.drop-meta { display: flex; align-items: center; flex-wrap: wrap; justify-content: center; gap: 7px; margin-top: 16px; color: var(--muted); font-size: 8.5px; }

.import-privacy {

  align-items: flex-start;

  margin-top: 11px;
  padding: 0 4px;

.manual-toggle {
  width: 100%;

.import-empty-panel, .import-loading-panel, .import-error-panel {

}
.empty-panel-icon {

}

.extract-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; max-width: 540px; margin-top: 24px; text-align: left; }
.extract-grid > div { padding: 13px 14px 14px; border: 1px solid #e9ddce; border-radius: 10px; background: rgba(255, 252, 246, .7); }

.extract-grid strong { display: block; font-size: 11px; font-weight: 600; }

.import-example-note { display: flex; align-items: flex-start; gap: 7px; max-width: 540px; margin-top: 16px; padding: 9px 12px; border: 1px dashed #d8c4aa; border-radius: 8px; color: #8d755a; font-size: 9px; line-height: 1.7; text-align: left; }

.import-loading-panel { gap: 0; }
.loading-orbit {
  position: relative;

  display: grid; place-items: center;

  border: 1px solid #d9c4a9;
  border-radius: 50%;
  color: #a7794c;
  background: #fbf4e8;
}
.loading-orbit::before, .loading-orbit::after { content: ""; position: absolute; inset: -7px; border: 1px solid rgba(184, 92, 52, .2); border-radius: 50%; animation: orbitPulse 1.8s ease-out infinite; }
.loading-orbit::after { animation-delay: .7s; }
.loading-orbit .icon { width: 26px; height: 26px; }
.loading-steps { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 300px; margin-top: 21px; text-align: left; }

.loading-steps .icon { width: 13px; height: 13px; }
.loading-steps .active { color: var(--accent); }

.import-error-panel { min-height: 370px; }
.error-icon { width: 52px; height: 52px; display: grid; place-items: center; margin-bottom: 13px; border: 1px solid #ddc4b8; border-radius: 50%; background: #fcf2ed; color: #b26952; }
.error-icon .icon { width: 23px; height: 23px; }
.error-actions { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 20px; }
.error-tip { display: flex; align-items: flex-start; gap: 7px; max-width: 460px; margin-top: 20px; padding: 10px 13px; border: 1px dashed #d8c4aa; border-radius: 8px; color: #8d755a; font-size: 9px; line-height: 1.7; text-align: left; }
.error-tip .icon { width: 12px; height: 12px; flex: 0 0 auto; margin-top: 1px; }

.analysis-panel {
  padding: 22px 22px 20px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: var(--card);
  box-shadow: var(--shadow-sm);
}
.analysis-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-bottom: 17px; border-bottom: 1px solid #eee3d4; }
.analysis-top h2 { margin-top: 5px; font-family: var(--serif); font-size: 25px; font-weight: 500; letter-spacing: -.02em; }
.analysis-top p { max-width: 560px; margin-top: 5px; color: var(--ink-3); font-size: 9.5px; line-height: 1.7; }
.confidence-badge { flex: 0 0 auto; padding: 5px 9px; border-radius: 999px; font-size: 8px; letter-spacing: .03em; }
.confidence-badge.high { background: #edf6ee; color: #4e7b59; border: 1px solid #cfe4d2; }
.confidence-badge.mid { background: #fbf3e3; color: #8e6a33; border: 1px solid #ead9b9; }
.confidence-badge.low { background: #f9efec; color: #9d6152; border: 1px solid #e4cec6; }

.analysis-product-card {
  display: grid;
  grid-template-columns: 86px minmax(0, 1fr) 150px;
  gap: 14px;
  align-items: center;
  margin-top: 17px;
  padding: 12px;
  border: 1px solid #eadfd1;
  border-radius: 12px;
  background: #fffaf2;
}
.analysis-product-media { position: relative; width: 86px; height: 86px; overflow: hidden; border-radius: 8px; background: #e9dcc8; }
.analysis-product-media img { width: 100%; height: 100%; object-fit: cover; }
.analysis-product-media span { position: absolute; left: 4px; bottom: 4px; padding: 2px 4px; border-radius: 2px; background: rgba(32, 24, 17, .7); color: #fff; font-size: 6.5px; line-height: 1.5; }
.analysis-product-body { min-width: 0; }
.analysis-product-body h3 { margin-top: 2px; font-family: var(--serif); font-size: 18px; font-weight: 600; }
.analysis-product-meta { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.analysis-product-meta strong { color: var(--accent); font-size: 12px; }
.analysis-product-meta span { color: var(--muted); font-size: 8.5px; }
.alt-products { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin-top: 7px; }
.alt-products > span { color: var(--muted); font-size: 8px; }
.alt-products button { padding: 2px 6px; border: 1px solid #e1d3c0; border-radius: 999px; background: #fffdf8; color: #8e765c; font-size: 8px; }
.alt-products button:hover { border-color: var(--accent); color: var(--accent); }
.product-correct { align-self: stretch; display: flex; flex-direction: column; justify-content: center; padding-left: 12px; border-left: 1px solid #eadfd1; }
.product-correct label { margin-bottom: 4px; color: var(--muted); font-size: 8px; }
.product-correct .select-wrap select { height: 30px; font-size: 8.5px; background: #fffdf8; }

.analysis-section { margin-top: 19px; padding-top: 17px; border-top: 1px solid #eee3d4; }
.analysis-section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.analysis-section-head h3 { font-family: var(--serif); font-size: 17px; font-weight: 600; }
.analysis-section-head span { color: var(--muted); font-size: 8.5px; }
.import-point-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.import-point {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  padding: 8px 9px;
  border: 1px solid #e7dac9;
  border-radius: 8px;
  background: #fcf8f1;
  text-align: left;
  transition: all .16s;
}
.import-point:hover { border-color: #cbb298; background: #fffaf2; }
.import-point.active { border-color: #c18767; background: #fff8ee; box-shadow: inset 2px 0 0 var(--accent); }
.import-point .point-check { width: 14px; height: 14px; display: grid; place-items: center; flex: 0 0 auto; margin-top: 1px; border: 1px solid #cfbda6; border-radius: 50%; color: transparent; }
.import-point .point-check .icon { width: 9px; height: 9px; stroke-width: 2.6; }
.import-point.active .point-check { border-color: var(--accent); background: var(--accent); color: #fff; }
.import-point > span:last-child { min-width: 0; }
.import-point strong { display: block; color: #5c4b3b; font-size: 9.5px; font-weight: 600; line-height: 1.5; }
.import-point small { display: block; margin-top: 1px; color: var(--muted); font-size: 8px; line-height: 1.5; }
.import-point:disabled { opacity: .4; pointer-events: none; }
.custom-point-list { display: flex; flex-direction: column; gap: 6px; }
.custom-point-list > div { display: flex; align-items: flex-start; gap: 7px; padding: 8px 10px; border: 1px solid #e7dac9; border-radius: 8px; background: #fcf8f1; color: #5f4f3e; font-size: 9.5px; line-height: 1.65; }
.custom-point-list .icon { width: 12px; height: 12px; flex: 0 0 auto; margin-top: 2px; color: var(--accent); }
.muted { color: var(--muted); font-size: 9px; }

.reco-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
.reco-card {
  padding: 10px 11px 11px;
  border: 1px solid #e7dac9;
  border-radius: 9px;
  background: #fcf8f1;
  text-align: left;
  transition: all .16s;
}
.reco-card:hover { border-color: #cbb298; background: #fffaf2; }
.reco-card.active { border-color: #c18767; background: #fff8ee; box-shadow: inset 0 2px 0 var(--accent); }
.reco-card-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.reco-card-top strong { font-size: 10.5px; font-weight: 600; }
.reco-card-top span { padding: 1px 4px; border-radius: 3px; background: #f1e6d6; color: #a17b51; font-size: 7px; }
.reco-card.active .reco-card-top span { background: var(--accent); color: #fff; }
.reco-audience { margin-top: 5px; color: #8e6b45; font-size: 8px; line-height: 1.5; }
.reco-card p { margin-top: 4px; color: var(--muted); font-size: 8px; line-height: 1.55; }

.audience-strip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-top: 19px;
  padding: 13px 15px;
  border: 1px solid #e8dac8;
  border-radius: 10px;
  background: #fbf5ea;
}
.audience-strip > div:first-child { flex: 0 0 auto; }
.audience-strip strong { display: block; margin-top: 3px; font-family: var(--serif); font-size: 15px; font-weight: 600; }
.audience-tags { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
.audience-tags span { padding: 4px 8px; border: 1px solid #dbc8b1; border-radius: 999px; background: #fffdf8; color: #795f44; font-size: 8.5px; }

.import-actions { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 19px; }
.import-actions-note { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 8.5px; line-height: 1.6; }
.import-actions-note .icon { width: 12px; height: 12px; color: #b28d5b; }
.raw-ocr { margin-top: 17px; padding-top: 14px; border-top: 1px solid #eee3d4; }
.raw-ocr summary { cursor: pointer; color: var(--muted); font-size: 9px; }
.raw-ocr summary span { color: #b3a18a; }
.raw-ocr pre { max-height: 280px; overflow: auto; margin: 9px 0 0; padding: 11px 12px; border: 1px solid #e8ddcd; border-radius: 8px; background: #faf6ee; color: #756555; font-family: var(--sans); font-size: 8.5px; line-height: 1.7; white-space: pre-wrap; word-break: break-all; }

@keyframes scanDown {
  0% { top: 2%; opacity: 0; }
  15% { opacity: 1; }
  70% { opacity: 1; }
  100% { top: 98%; opacity: 0; }
}
@keyframes orbitPulse {
  0% { transform: scale(.86); opacity: .8; }
  100% { transform: scale(1.25); opacity: 0; }
}

/* ---------- Product library ---------- */
.product-library { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 15px; }
.library-card {
  display: grid;
  grid-template-columns: 188px minmax(0, 1fr);
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: var(--card);
  box-shadow: var(--shadow-sm);
}
.library-media { position: relative; min-height: 212px; background: #e9ddcc; overflow: hidden; }
.library-media img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease; }
.library-card:hover .library-media img { transform: scale(1.025); }
.library-media::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, rgba(28, 18, 9, .36)); }
.library-media .tag {
  position: absolute;
  top: 11px;
  left: 11px;
  z-index: 1;
  padding: 4px 7px;
  border-radius: 3px;
  background: rgba(255, 250, 241, .9);
  color: #795a3b;
  font-size: 8px;
  letter-spacing: .06em;
  backdrop-filter: blur(4px);
}
.library-body { display: flex; flex-direction: column; min-width: 0; padding: 17px 17px 15px; }
.library-body h3 { margin-top: 5px; font-family: var(--serif); font-size: 21px; font-weight: 600; line-height: 1.25; letter-spacing: -.01em; }
.library-headline { margin-top: 5px; color: var(--ink-3); font-size: 10px; line-height: 1.6; }
.library-points { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 11px; }
.library-points span { padding: 3px 6px; border-radius: 3px; background: #f4ecdf; color: #846f58; font-size: 8px; line-height: 1.5; }
.library-bottom { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin-top: auto; padding-top: 14px; }
.library-price { display: flex; align-items: baseline; gap: 5px; flex-wrap: wrap; }
.library-price strong { color: var(--accent); font-family: var(--serif); font-size: 17px; font-weight: 600; }
.library-price small { color: var(--muted); font-size: 8px; }
.library-spec { margin-top: 2px; color: #a18f7a; font-size: 8px; }
.library-actions { display: flex; align-items: center; gap: 5px; }
.library-custom {
  grid-column: 1 / -1;
  display: grid;
  place-items: center;
  min-height: 150px;
  border: 1px dashed #cbb69d;
  border-radius: 16px;
  background:
    repeating-linear-gradient(135deg, rgba(204, 185, 160, .08) 0 8px, transparent 8px 16px);
  text-align: center;
  padding: 24px;
  transition: all .18s;
}
.library-custom:hover { border-color: var(--accent); background-color: rgba(184, 92, 52, .025); }
.library-custom .plus-circle {
  width: 40px; height: 40px;
  display: grid; place-items: center;
  margin: 0 auto 10px;
  border: 1px solid #cdb79a;
  border-radius: 50%;
  color: #a17d56;
  transition: all .18s;
}
.library-custom:hover .plus-circle { background: var(--accent); border-color: var(--accent); color: #fff; }
.library-custom h4, .library-custom-title { display: block; font-family: var(--serif); font-size: 17px; font-weight: 500; }
.library-custom p, .library-custom-desc { display: block; margin-top: 4px; color: var(--muted); font-size: 9.5px; }
.product-footnote {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 18px;
  color: var(--muted);
  font-size: 9.5px;
}
.product-footnote .icon { width: 13px; height: 13px; color: #b18d5f; }

/* ---------- Materials ---------- */
.material-summary {
  display: flex;
  align-items: center;
  gap: 22px;

  padding: 12px 16px;

.material-toolbar {

  justify-content: space-between;

  margin-bottom: 14px;

.material-toolbar p { color: var(--muted); font-size: 9px; }
.material-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 13px; }
.material-card {
  position: relative;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--card);
  box-shadow: var(--shadow-sm);
  transition: transform .18s, border-color .18s, box-shadow .18s;
}
.material-card:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(54, 34, 16, .09); }
.material-card.selected { border-color: #bc7c58; box-shadow: 0 0 0 2px rgba(184, 92, 52, .12); }
.material-thumb { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: #e9ddcc; }
.material-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s; }
.material-card:hover .material-thumb img { transform: scale(1.025); }
.material-type-tag {
  position: absolute;
  top: 8px;
  left: 8px;
  padding: 3px 6px;
  border-radius: 3px;
  background: rgba(34, 26, 18, .64);
  color: #f8efe2;
  font-size: 7px;
  letter-spacing: .04em;
  backdrop-filter: blur(4px);
}
.material-check {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 21px; height: 21px;
  display: grid; place-items: center;
  border: 1px solid rgba(255, 255, 255, .6);
  border-radius: 50%;
  background: rgba(28, 21, 15, .34);
  color: transparent;
  backdrop-filter: blur(4px);
}
.material-check .icon { width: 12px; height: 12px; stroke-width: 2.4; }
.material-card.selected .material-check { background: var(--accent); border-color: var(--accent); color: #fff; }
.material-body { padding: 9px 10px 10px; }
.material-body h4 { overflow: hidden; font-size: 10.5px; font-weight: 600; white-space: nowrap; text-overflow: ellipsis; }
.material-body p { margin-top: 2px; color: var(--muted); font-size: 8px; }
.material-actions { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 8px; }
.material-actions .toggle-link { padding: 0; border: 0; background: none; color: var(--accent); font-size: 8.5px; }
.material-actions .delete-link { padding: 0; border: 0; background: none; color: #b49d85; font-size: 8.5px; }
.material-actions .delete-link:hover { color: var(--danger); }
.material-empty {
  grid-column: 1 / -1;
  padding: 34px;
  border: 1px dashed var(--line-strong);
  border-radius: 12px;
  text-align: center;
  color: var(--muted);
  font-size: 10px;
}

/* ---------- Saved ---------- */
.saved-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; color: var(--muted); font-size: 10px; }
.saved-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
.saved-card {
  display: flex;
  flex-direction: column;
  padding: 17px 17px 14px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--card);
  box-shadow: var(--shadow-sm);
}
.saved-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.saved-head h3 { font-family: var(--serif); font-size: 17px; font-weight: 600; }
.saved-meta { margin-top: 2px; color: var(--muted); font-size: 8.5px; }
.saved-text {
  margin-top: 10px;
  color: #4c4034;
  font-size: 10.8px;
  line-height: 1.8;
  white-space: pre-wrap;
  word-break: break-word;
  display: -webkit-box;
  -webkit-line-clamp: 6;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.saved-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: auto; padding-top: 13px; }
.saved-foot .copy-btns { justify-content: flex-end; }
.empty-state {
  display: grid;
  place-items: center;
  min-height: 330px;
  padding: 30px;
  border: 1px dashed var(--line-strong);
  border-radius: 16px;
  background: rgba(255, 253, 248, .45);
  text-align: center;
}
.empty-icon {
  width: 62px; height: 62px;
  display: grid; place-items: center;
  margin: 0 auto 14px;
  border: 1px solid #ddcdb7;
  border-radius: 50%;
  color: #b18d63;
  background: #fbf7ef;
}
.empty-icon .icon { width: 26px; height: 26px; }
.empty-state h3 { font-family: var(--serif); font-size: 21px; font-weight: 500; }
.empty-state p { max-width: 340px; margin: 6px auto 18px; color: var(--muted); font-size: 10.5px; line-height: 1.8; }

/* ---------- Modal ---------- */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-items: center;
  padding: 20px;
  background: rgba(25, 18, 12, .55);
  backdrop-filter: blur(5px);
  animation: overlayIn .2s ease both;
}
.modal {
  width: min(640px, 100%);
  max-height: 88vh;
  overflow-y: auto;
  padding: 27px 28px 24px;
  border: 1px solid rgba(255, 249, 239, .3);
  border-radius: 20px;
  background: #fbf7ef;
  box-shadow: 0 30px 90px rgba(0, 0, 0, .35);
  animation: modalIn .26s cubic-bezier(.2, .7, .2, 1) both;
}
.modal.wide { width: min(720px, 100%); }
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; margin-bottom: 20px; }
.modal-head h2 { margin-top: 5px; font-family: var(--serif); font-size: 27px; font-weight: 500; letter-spacing: -.01em; }
.modal-head p { margin-top: 5px; color: var(--muted); font-size: 10px; line-height: 1.7; }
.modal-close { width: 34px; height: 34px; display: grid; place-items: center; flex: 0 0 auto; border: 1px solid var(--line); border-radius: 50%; background: transparent; color: var(--ink-3); }
.modal-close:hover { background: #f2e9dc; }
.modal-close .icon { width: 15px; height: 15px; }

.guide-steps { display: flex; flex-direction: column; gap: 15px; }
.guide-step { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; }
.guide-num { width: 26px; height: 26px; display: grid; place-items: center; border: 1px solid #d8c5ac; border-radius: 50%; color: var(--accent); font-family: var(--serif); font-size: 11px; }
.guide-step h3 { font-size: 12.5px; font-weight: 600; }
.guide-step p { margin-top: 2px; color: var(--ink-3); font-size: 10px; line-height: 1.75; }
.guide-note {
  margin-top: 21px;
  padding: 13px 15px;
  border-left: 2px solid var(--gold);
  background: #f4ebdd;
  color: #7c6955;
  font-size: 9.5px;
  line-height: 1.8;
}
.guide-note strong { color: #5e4b37; }
.modal-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); }

.form-grid { display: grid; gap: 13px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-field label { display: block; margin-bottom: 5px; color: #6d5d4c; font-size: 10px; font-weight: 600; letter-spacing: .02em; }
.form-field label small { margin-left: 4px; color: #ad9b86; font-weight: 400; }
.form-field input, .form-field textarea {
  width: 100%;
  min-height: 38px;
  padding: 8px 10px;
  border: 1px solid #ded0bd;
  border-radius: 7px;
  background: #fffdf8;
  outline: none;
  font-size: 11px;
  line-height: 1.7;
  transition: border-color .16s, box-shadow .16s;
}
.form-field textarea { min-height: 104px; resize: vertical; }
.form-field input:focus, .form-field textarea:focus { border-color: #c4956d; box-shadow: 0 0 0 3px rgba(184, 92, 52, .07); }
.form-hint { margin-top: 5px; color: #a18e78; font-size: 8.5px; line-height: 1.6; }
.form-error { display: none; margin-top: 4px; color: var(--danger); font-size: 9px; }
.form-field.invalid input, .form-field.invalid textarea { border-color: #cc7c67; }
.form-field.invalid .form-error { display: block; }

/* ---------- Toast ---------- */
#toast-root { position: fixed; left: 50%; bottom: 28px; z-index: 200; transform: translateX(-50%); pointer-events: none; }
.toast {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 41px;
  padding: 0 17px;
  border: 1px solid rgba(255, 245, 230, .16);
  border-radius: 999px;
  background: rgba(32, 25, 18, .94);
  color: #f9edda;
  font-size: 11px;
  letter-spacing: .02em;
  box-shadow: 0 14px 38px rgba(0, 0, 0, .28);
  backdrop-filter: blur(8px);
  animation: toastIn .24s cubic-bezier(.2, .8, .2, 1) both;
}
.toast .icon { width: 14px; height: 14px; color: #b7d8a8; }
.toast.leaving { animation: toastOut .22s ease both; }

/* ---------- Animations ---------- */
@keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes modalIn { from { opacity: 0; transform: translateY(12px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes toastIn { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(6px) scale(.98); } }
@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin .5s linear; }

    const sensory = product.voice && product.voice.sensory
      ? pick(product.voice.sensory, seed + 1)
      : '用料实在，吃起来能尝出区别。';
    const context = product.voice && product.voice.context
      ? pick(product.voice.context, seed + 3)
      : '好食材不一定会说话，但吃进嘴里就知道。';
    const trust = product.voice && product.voice.trust
      ? product.voice.trust
      : '用料和细节都摆在这里。';
    const sellerLine = product.voice && product.voice.sellerLines
      ? pick(product.voice.sellerLines, seed + 4)
      : '随手拍的，没有摆盘。';
    const personaOpener = pick(persona.openers, seed + 5);
    const personaCloser = pick(persona.closers, seed + 6);

    const price = product.priceLines
      ? (length.id === 'short'
        ? product.priceLines.short
        : length.id === 'long'
          ? pick([product.priceLines.standard, product.priceLines.action], seed + 2)
          : pick([product.priceLines.short, product.priceLines.standard], seed + 2))
      : product.price;
    const actionPrice = product.priceLines ? pick([
      product.priceLines.action,
      product.priceLines.standard,
      product.priceLines.short
    ], seed + 7) : product.price;
    const cta = ctaEnabled ? ctaObj.text : '';

    function proofs(count, short) {
      if (!points.length) return [];
      const result = [];
      for (let i = 0; i < Math.min(count, points.length); i += 1) {
        const p = points[(seed + i) % points.length];
        result.push(short ? p.short : p.copy);
      }
      return result;
    }

    const priceForPitch = priceEnabled ? price : '';
    const finalPitch = [priceForPitch, cta].filter(Boolean).join('');

    return {
      product: product,
      scene: scene,
      sceneOpener: sceneOpener,
      persona: persona,
      personaOpener: personaOpener,
      personaCloser: personaCloser,
      length: length,
      cfg: cfg,
      points: points,
      sensory: sensory,
      context: context,
      trust: trust,
      sellerLine: sellerLine,
      note: normalizeNote(options.sellerNote),
      price: priceForPitch,
      actionPrice: priceEnabled ? actionPrice : '',
      cta: cta,
      finalPitch: finalPitch || personaCloser,
      proofs: proofs,
      emojiEnabled: emojiEnabled,
      sceneEmoji: sceneEmoji,
      productEmoji: productEmoji,
      hashtagsEnabled: hashtagsEnabled
    };
  }

  function finishVariant(lines, ctx, angleIndex) {
    let clean = lines
      .filter(function (line) { return line && String(line).trim(); })
      .map(function (line) { return ensurePeriod(line); });

    // 标题句（“把卖点摊开说：”）不需要句号，单独还原
    clean = clean.map(function (line) {
      if (/[：:]$/.test(line.replace(/。$/, ''))) return line.replace(/。$/, '');
      return line;
    });

    if (ctx.emojiEnabled) {
      if (clean[0]) clean[0] = addEmoji(clean[0], ctx.sceneEmoji);
      if (clean.length > 2 && angleIndex !== 4) {
        clean[clean.length - 1] = addEmoji(clean[clean.length - 1], ctx.productEmoji);
      }
    }

    let text = clean.join('\n\n');
    if (ctx.hashtagsEnabled) {
      const tags = unique([
        pick(ctx.scene.hashtags, angleIndex),
        pick(ctx.product.hashtags, angleIndex + 2),
        pick(ctx.product.hashtags, angleIndex + 3)
      ]).slice(0, 3);
      if (tags.length) text += '\n\n' + tags.join(' ');
    }
    return text;
  }

  function charCount(text) {
    return String(text || '').replace(/\s/g, '').length;
  }

  function generate(product, options) {
    if (!product) return [];
    const seed = Math.abs(parseInt(options.seed, 10) || 0);
    const results = angles.map(function (angle, index) {
      const localSeed = seed + index * 7;
      const ctx = buildContext(product, options, localSeed);
      const lines = angle.build(ctx);
      const text = finishVariant(lines, ctx, index);
      return {
        id: angle.id + '-' + (seed + index),
        angle: angle.id,
        title: angle.title,
        note: angle.note,
        text: text,
        chars: charCount(text),
        angleIndex: index
      };
    });
    return results;
  }

  window.DYGenerator = {
    generate: generate,
    charCount: charCount
  };
})();
