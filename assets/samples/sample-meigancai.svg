<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-label="黑猪肉梅干菜馅饼产品示意图">
  <defs>
    <radialGradient id="bg" cx="42%" cy="34%" r="82%">
      <stop offset="0" stop-color="#f6e7cf"/>
      <stop offset=".55" stop-color="#e4c79f"/>
      <stop offset="1" stop-color="#b98b5f"/>
    </radialGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf4e8"/>
      <stop offset="1" stop-color="#e8d6bc"/>
    </linearGradient>
    <radialGradient id="plate" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#fffefb"/>
      <stop offset=".78" stop-color="#f7efe2"/>
      <stop offset="1" stop-color="#dfccb0"/>
    </radialGradient>
    <linearGradient id="crust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6cd7c"/>
      <stop offset=".45" stop-color="#e7a648"/>
      <stop offset="1" stop-color="#bd6a22"/>
    </linearGradient>
    <linearGradient id="crustDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dda04d"/>
      <stop offset="1" stop-color="#9e4f18"/>
    </linearGradient>
    <linearGradient id="filling" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6e3a20"/>
      <stop offset=".5" stop-color="#8e4c25"/>
      <stop offset="1" stop-color="#522713"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c9b52"/>
      <stop offset="1" stop-color="#466b32"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <radialGradient id="vignette" cx="50%" cy="46%" r="72%">
      <stop offset=".55" stop-color="#2b1608" stop-opacity="0"/>
      <stop offset="1" stop-color="#2b1608" stop-opacity=".34"/>
    </radialGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".07"/></feComponentTransfer>
    </filter>
    <clipPath id="plateClip"><ellipse cx="400" cy="430" rx="278" ry="268"/></clipPath>
  </defs>

  <rect width="800" height="800" fill="url(#bg)"/>
  <rect width="800" height="800" fill="url(#vignette)"/>

  <!-- linen -->
  <g opacity=".9">
    <path d="M-40 560 C160 470 300 520 440 610 C590 706 710 700 850 620 L850 850 L-40 850 Z" fill="url(#cloth)"/>
    <path d="M-40 560 C160 470 300 520 440 610 C590 706 710 700 850 620" fill="none" stroke="#d4b993" stroke-width="3" opacity=".7"/>
    <path d="M20 620 C190 540 320 570 470 665" fill="none" stroke="#cbb08a" stroke-width="2" opacity=".45"/>
    <path d="M50 700 C230 620 370 660 520 745" fill="none" stroke="#cbb08a" stroke-width="2" opacity=".4"/>
  </g>

  <!-- plate shadow -->
  <ellipse cx="410" cy="470" rx="292" ry="278" fill="#3e210d" opacity=".38" filter="url(#shadow)"/>
  <ellipse cx="400" cy="442" rx="280" ry="270" fill="url(#plate)"/>
  <ellipse cx="400" cy="442" rx="255" ry="244" fill="none" stroke="#dfc9a9" stroke-width="5" opacity=".65"/>
  <ellipse cx="400" cy="442" rx="236" ry="224" fill="none" stroke="#eddfc9" stroke-width="2"/>
  <g clip-path="url(#plateClip)">
    <ellipse cx="330" cy="330" rx="160" ry="110" fill="#fffdf8" opacity=".5" filter="url(#soft)"/>
  </g>

  <!-- back pie -->
  <g transform="translate(478 350) rotate(9)">
    <ellipse cx="0" cy="92" rx="150" ry="38" fill="#4c2a12" opacity=".33" filter="url(#soft)"/>
    <path d="M-146 16 C-146 -74 -76 -124 0 -124 C76 -124 146 -74 146 16 C146 62 94 90 0 90 C-94 90 -146 62 -146 16Z" fill="url(#crustDark)"/>
    <path d="M-127 10 C-127 -61 -68 -101 0 -101 C68 -101 127 -61 127 10 C127 48 81 70 0 70 C-81 70 -127 48 -127 10Z" fill="url(#crust)"/>
    <path d="M-83 4 C-55 -17 -21 -27 12 -23" fill="none" stroke="#f9dea0" stroke-width="8" stroke-linecap="round" opacity=".55"/>
    <g fill="#8b4a1c" opacity=".55">
      <ellipse cx="-68" cy="-32" rx="5" ry="3"/><ellipse cx="-36" cy="-58" rx="4" ry="2.6"/>
      <ellipse cx="22" cy="-63" rx="4.5" ry="3"/><ellipse cx="62" cy="-32" rx="4" ry="2.4"/>
      <ellipse cx="88" cy="12" rx="5" ry="3"/><ellipse cx="44" cy="45" rx="4" ry="2.6"/>
      <ellipse cx="-20" cy="55" rx="4" ry="2.5"/><ellipse cx="-86" cy="30" rx="4.5" ry="2.8"/>
    </g>
    <g fill="#fff4d8" opacity=".9">
      <ellipse cx="-42" cy="-42" rx="4" ry="2"/><ellipse cx="34" cy="-44" rx="3.4" ry="1.8"/>
      <ellipse cx="70" cy="2" rx="3.8" ry="2"/><ellipse cx="12" cy="34" rx="3.2" ry="1.7"/>
      <ellipse cx="-68" cy="8" rx="3" ry="1.6"/>
    </g>
  </g>

  <!-- front pie -->
  <g transform="translate(368 470)">
    <ellipse cx="0" cy="104" rx="186" ry="48" fill="#43210e" opacity=".4" filter="url(#soft)"/>
    <path d="M-181 26 C-181 -88 -102 -158 0 -158 C102 -158 181 -88 181 26 C181 84 118 116 0 116 C-118 116 -181 84 -181 26Z" fill="url(#crustDark)"/>
    <path d="M-163 20 C-163 -75 -92 -135 0 -135 C92 -135 163 -75 163 20 C163 73 108 100 0 100 C-108 100 -163 73 -163 20Z" fill="url(#crust)"/>
    <path d="M-125 12 C-125 -57 -68 -101 0 -101 C68 -101 125 -57 125 12 C125 56 84 78 0 78 C-84 78 -125 56 -125 12Z" fill="#e8aa51" opacity=".5"/>
    <!-- crimped edge -->
    <g stroke="#b96925" stroke-width="5" opacity=".7" stroke-linecap="round">
      <path d="M-150 39 l-12 7"/><path d="M-132 66 l-10 10"/><path d="M-100 87 l-7 13"/>
      <path d="M-60 101 l-4 14"/><path d="M-12 108 l-1 14"/><path d="M38 104 l4 14"/>
      <path d="M84 91 l8 13"/><path d="M121 70 l10 11"/><path d="M148 43 l12 8"/>
    </g>
    <!-- cut opening -->
    <g transform="rotate(-8)">
      <path d="M-112 -5 C-66 -49 45 -56 107 -9 C115 47 52 83 -9 80 C-66 78 -111 48 -112 -5Z" fill="#5a2b14"/>
      <path d="M-94 -3 C-52 -36 40 -42 91 -6 C97 38 45 66 -6 64 C-57 62 -93 35 -94 -3Z" fill="url(#filling)"/>
      <!-- meat + preserved mustard pieces -->
      <g>
        <ellipse cx="-52" cy="6" rx="27" ry="15" fill="#a35b2d" transform="rotate(-12 -52 6)"/>
        <ellipse cx="-14" cy="-12" rx="22" ry="11" fill="#b56834" transform="rotate(8 -14 -12)"/>
        <ellipse cx="31" cy="9" rx="26" ry="12" fill="#8f4922" transform="rotate(-6 31 9)"/>
        <ellipse cx="-28" cy="33" rx="19" ry="9" fill="#9e5329" transform="rotate(10 -28 33)"/>
        <ellipse cx="58" cy="-7" rx="18" ry="9" fill="#b16a36" transform="rotate(-15 58 -7)"/>
        <g fill="#4c5f34">
          <path d="M-76 18 c12 -10 25 -6 28 4 c-12 8 -23 7 -28 -4Z"/>
          <path d="M-4 32 c13 -7 24 -1 24 8 c-13 5 -22 3 -24 -8Z"/>
          <path d="M52 25 c10 -8 21 -4 22 4 c-11 7 -20 5 -22 -4Z"/>
          <path d="M-42 -21 c10 -6 20 -1 20 6 c-11 4 -18 2 -20 -6Z"/>
        </g>
        <g fill="#d9a264" opacity=".8">
          <ellipse cx="-13" cy="6" rx="8" ry="4" transform="rotate(-18 -13 6)"/>
          <ellipse cx="17" cy="22" rx="7" ry="3.6" transform="rotate(12 17 22)"/>
          <ellipse cx="46" cy="-16" rx="6" ry="3"/>
        </g>
      </g>
    </g>
    <!-- glossy highlight -->
    <path d="M-120 -70 C-77 -112 -6 -124 52 -106" fill="none" stroke="#ffe6b1" stroke-width="13" stroke-linecap="round" opacity=".38"/>
    <g fill="#fff5db" opacity=".95">
      <ellipse cx="-93" cy="-65" rx="4.5" ry="2.2" transform="rotate(-20 -93 -65)"/>
      <ellipse cx="-52" cy="-94" rx="4" ry="2" transform="rotate(-8 -52 -94)"/>
      <ellipse cx="24" cy="-113" rx="4.2" ry="2.1"/>
      <ellipse cx="90" cy="-76" rx="3.6" ry="1.8" transform="rotate(24 90 -76)"/>
      <ellipse cx="129" cy="-28" rx="4" ry="2" transform="rotate(30 129 -28)"/>
      <ellipse cx="122" cy="55" rx="3.4" ry="1.8" transform="rotate(18 122 55)"/>
      <ellipse cx="-145" cy="39" rx="3.6" ry="1.8" transform="rotate(-44 -145 39)"/>
    </g>
  </g>

  <!-- garnish -->
  <g>
    <path d="M170 585 C215 530 286 512 330 542 C294 590 228 612 170 585Z" fill="url(#leaf)"/>
    <path d="M170 585 C220 567 268 550 330 542" fill="none" stroke="#b7cf8e" stroke-width="3" opacity=".7"/>
    <path d="M592 592 C632 545 699 536 731 565 C697 612 641 626 592 592Z" fill="#5f7f42"/>
    <path d="M592 592 C638 575 681 559 731 565" fill="none" stroke="#9fbd78" stroke-width="3" opacity=".7"/>
    <g fill="#c1864d" opacity=".85">
      <ellipse cx="147" cy="347" rx="9" ry="5" transform="rotate(-20 147 347)"/>
      <ellipse cx="681" cy="330" rx="8" ry="4" transform="rotate(25 681 330)"/>
      <ellipse cx="646" cy="695" rx="7" ry="4" transform="rotate(14 646 695)"/>
    </g>
  </g>

  <!-- steam -->
  <g fill="none" stroke="#fff8ea" stroke-width="7" stroke-linecap="round" opacity=".34" filter="url(#blur2)">
    <path d="M320 242 C300 210 330 190 316 156"/>
    <path d="M392 220 C370 184 400 164 386 128"/>
    <path d="M462 246 C444 214 470 194 456 160"/>
    <path d="M530 278 C513 248 536 228 523 198"/>
  </g>

  <!-- crumbs -->
  <g fill="#b8783d" opacity=".7">
    <circle cx="253" cy="616" r="4"/><circle cx="286" cy="644" r="3"/><circle cx="556" cy="638" r="3.6"/>
    <circle cx="591" cy="616" r="2.7"/><circle cx="377" cy="682" r="2.8"/>
  </g>

  <rect width="800" height="800" filter="url(#noise)" opacity=".65"/>
</svg>
