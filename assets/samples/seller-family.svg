<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-label="家庭餐桌馅饼卖家秀示意图">
  <defs>
    <radialGradient id="f-bg" cx="48%" cy="38%" r="82%">
      <stop offset="0" stop-color="#8d5e3c"/>
      <stop offset=".55" stop-color="#633d26"/>
      <stop offset="1" stop-color="#3a2115"/>
    </radialGradient>
    <linearGradient id="f-table" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f603e"/>
      <stop offset=".5" stop-color="#75482d"/>
      <stop offset="1" stop-color="#56311e"/>
    </linearGradient>
    <radialGradient id="f-plate" cx="50%" cy="43%" r="62%">
      <stop offset="0" stop-color="#fdf8ee"/>
      <stop offset=".82" stop-color="#f1e5d2"/>
      <stop offset="1" stop-color="#d0b99c"/>
    </radialGradient>
    <radialGradient id="f-plate2" cx="50%" cy="43%" r="62%">
      <stop offset="0" stop-color="#f6f1e6"/>
      <stop offset=".82" stop-color="#e6dac6"/>
      <stop offset="1" stop-color="#bfa787"/>
    </radialGradient>
    <linearGradient id="f-crust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d18a"/>
      <stop offset=".5" stop-color="#e3a247"/>
      <stop offset="1" stop-color="#a9581d"/>
    </linearGradient>
    <linearGradient id="f-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#71381d"/>
      <stop offset="1" stop-color="#421c0d"/>
    </linearGradient>
    <linearGradient id="f-leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8bad5d"/>
      <stop offset="1" stop-color="#507034"/>
    </linearGradient>
    <linearGradient id="f-skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3c9a5"/>
      <stop offset="1" stop-color="#d99b70"/>
    </linearGradient>
    <filter id="f-shadow" x="-40%" y="-40%" width="180%" height="190%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="f-soft"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="f-noise">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".07"/></feComponentTransfer>
    </filter>
    <radialGradient id="f-light" cx="30%" cy="22%" r="66%">
      <stop offset="0" stop-color="#ffdc9e" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffdc9e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="f-vig" cx="50%" cy="46%" r="72%">
      <stop offset=".5" stop-color="#241108" stop-opacity="0"/>
      <stop offset="1" stop-color="#241108" stop-opacity=".45"/>
    </radialGradient>
  </defs>

  <rect width="800" height="800" fill="url(#f-bg)"/>
  <rect width="800" height="800" fill="url(#f-table)"/>
  <rect width="800" height="800" fill="url(#f-light)"/>
  <g stroke="#422413" stroke-width="2" opacity=".3">
    <path d="M0 140 C240 164 540 118 800 150"/>
    <path d="M0 300 C260 322 520 270 800 300"/>
    <path d="M0 520 C220 545 560 500 800 528"/>
    <path d="M0 712 C250 736 520 690 800 716"/>
  </g>
  <rect width="800" height="800" fill="url(#f-vig)"/>

  <!-- main plate -->
  <g transform="translate(360 380)">
    <ellipse cx="18" cy="22" rx="268" ry="250" fill="#2a1308" opacity=".48" filter="url(#f-shadow)"/>
    <circle r="260" fill="url(#f-plate)"/>
    <circle r="239" fill="none" stroke="#dfcbb0" stroke-width="5" opacity=".7"/>
    <circle r="214" fill="none" stroke="#eddfca" stroke-width="2"/>
  </g>

  <!-- main pie -->
  <g transform="translate(326 360) rotate(-10)">
    <ellipse cx="0" cy="96" rx="184" ry="42" fill="#35190a" opacity=".45" filter="url(#f-soft)"/>
    <path d="M-178 24 C-178 -87 -106 -151 0 -151 C106 -151 178 -87 178 24 C178 86 116 116 0 116 C-116 116 -178 86 -178 24Z" fill="#a95a1e"/>
    <path d="M-162 20 C-162 -73 -93 -132 0 -132 C93 -132 162 -73 162 20 C162 73 104 100 0 100 C-104 100 -162 73 -162 20Z" fill="url(#f-crust)"/>
    <g transform="rotate(6)">
      <path d="M-121 5 C-73 -49 45 -55 113 -5 C120 52 56 84 -9 81 C-72 78 -123 50 -121 5Z" fill="#4a1f0e"/>
      <path d="M-106 4 C-61 -38 41 -44 100 -4 C106 42 50 69 -6 66 C-61 63 -108 40 -106 4Z" fill="url(#f-fill)"/>
      <g fill="#a95f30">
        <ellipse cx="-52" cy="6" rx="26" ry="13" transform="rotate(-10 -52 6)"/>
        <ellipse cx="20" cy="-13" rx="21" ry="10" transform="rotate(9 20 -13)"/>
        <ellipse cx="55" cy="22" rx="18" ry="9" transform="rotate(-8 55 22)"/>
        <ellipse cx="-23" cy="38" rx="16" ry="8" transform="rotate(7 -23 38)"/>
      </g>
      <g fill="#546b39">
        <path d="M-81 24 c9 -8 19 -5 21 2 c-9 6 -17 5 -21 -2Z"/>
        <path d="M-5 47 c9 -5 18 -2 19 4 c-9 5 -16 4 -19 -4Z"/>
        <path d="M67 3 c8 -6 17 -3 18 3 c-8 5 -15 4 -18 -3Z"/>
      </g>
      <g fill="#ffedc9" opacity=".82">
        <ellipse cx="-14" cy="3" rx="4" ry="1.8"/><ellipse cx="35" cy="-15" rx="3.4" ry="1.6"/>
      </g>
    </g>
    <path d="M-128 -68 C-82 -112 -8 -126 54 -106" fill="none" stroke="#ffe7b8" stroke-width="13" stroke-linecap="round" opacity=".34"/>
    <g fill="#fff6df" opacity=".94">
      <ellipse cx="-97" cy="-68" rx="4.4" ry="2.2" transform="rotate(-20 -97 -68)"/>
      <ellipse cx="-46" cy="-101" rx="3.8" ry="1.9"/>
      <ellipse cx="24" cy="-117" rx="4" ry="2"/>
      <ellipse cx="91" cy="-80" rx="3.4" ry="1.7" transform="rotate(24 91 -80)"/>
      <ellipse cx="136" cy="-28" rx="3.8" ry="1.9" transform="rotate(30 136 -28)"/>
      <ellipse cx="133" cy="60" rx="3.2" ry="1.6" transform="rotate(18 133 60)"/>
    </g>
  </g>

  <!-- second plate -->
  <g transform="translate(678 604) rotate(4)">
    <ellipse cx="0" cy="9" rx="141" ry="126" fill="#2a1308" opacity=".4" filter="url(#f-soft)"/>
    <circle r="136" fill="url(#f-plate2)"/>
    <circle r="120" fill="none" stroke="#d2bda2" stroke-width="4" opacity=".65"/>
    <!-- half pie -->
    <g transform="translate(-18 4) rotate(14)">
      <path d="M-88 8 C-65 -55 25 -71 79 -23 C72 35 27 67 -31 52 C-63 44 -86 30 -88 8Z" fill="#b86423"/>
      <path d="M-75 8 C-54 -42 20 -55 67 -18 C61 30 24 54 -25 43 C-52 36 -73 25 -75 8Z" fill="url(#f-crust)"/>
      <g>
        <ellipse cx="-13" cy="-5" rx="35" ry="20" fill="#4d220f" transform="rotate(8 -13 -5)"/>
        <ellipse cx="-16" cy="-6" rx="28" ry="15" fill="#75401f" transform="rotate(8 -16 -6)"/>
        <g fill="#566d3a">
          <path d="M-35 -1 c8 -6 16 -3 18 3 c-8 5 -14 4 -18 -3Z"/>
          <path d="M5 2 c7 -5 14 -2 15 3 c-7 4 -12 3 -15 -3Z"/>
        </g>
        <g fill="#a95f30"><ellipse cx="-5" cy="-12" rx="10" ry="5"/><ellipse cx="12" cy="0" rx="9" ry="4.5"/></g>
      </g>
    </g>
    <!-- greens -->
    <g>
      <g fill="url(#f-leaf)" transform="translate(60 3) rotate(-22)">
        <path d="M0 0 C28 -25 62 -16 74 8 C50 32 18 24 0 0Z"/>
        <path d="M-8 24 C17 3 45 12 52 34 C32 54 7 46 -8 24Z"/>
      </g>
    </g>
  </g>

  <!-- kid's divided plate -->
  <g transform="translate(168 654) rotate(-6)">
    <ellipse cx="0" cy="7" rx="128" ry="110" fill="#2a1308" opacity=".38" filter="url(#f-soft)"/>
    <circle r="126" fill="#f0c45f"/>
    <circle r="111" fill="#f6d987"/>
    <path d="M0 -111 L0 111 M-111 0 L111 0" stroke="#e7bb57" stroke-width="10"/>
    <!-- piece pie -->
    <g transform="translate(60 55) rotate(10)">
      <path d="M-40 0 C-30 -34 9 -43 34 -22 C35 10 12 29 -17 25 C-33 22 -40 12 -40 0Z" fill="#b86522"/>
      <path d="M-31 0 C-23 -25 8 -32 27 -16 C27 9 9 22 -13 19 C-25 17 -31 9 -31 0Z" fill="url(#f-crust)"/>
      <ellipse cx="-2" cy="-5" rx="15" ry="9" fill="#75401f"/>
    </g>
    <!-- egg half -->
    <g transform="translate(-55 35)">
      <circle r="29" fill="#fffdf6"/>
      <circle r="16" fill="#f4b83f"/>
    </g>
    <!-- broccoli -->
    <g transform="translate(-58 -48)" fill="#5f843e">
      <circle cx="-12" cy="-10" r="13"/><circle cx="8" cy="-14" r="14"/><circle cx="16" cy="2" r="12"/>
      <circle cx="-2" cy="8" r="13"/><rect x="-4" y="18" width="8" height="22" rx="4" fill="#9bb86b"/>
    </g>
    <g fill="#e8b94f" opacity=".75"><circle cx="55" cy="-58" r="3"/><circle cx="72" cy="-43" r="2.4"/></g>
  </g>

  <!-- hands: adult left holding pie, child reaching -->
  <g transform="translate(96 246) rotate(18)">
    <path d="M0 0 C55 -8 108 2 150 34 C164 45 158 66 141 66 C118 66 92 53 72 42 C49 29 11 28 0 18 Z" fill="url(#f-skin)"/>
    <path d="M140 34 C157 25 178 28 181 43 C184 58 165 68 148 59" fill="url(#f-skin)"/>
    <g fill="none" stroke="#c9865c" stroke-width="2" opacity=".5">
      <path d="M31 9 C41 22 53 35 68 42"/>
      <path d="M137 38 C145 34 157 34 166 38"/>
    </g>
    <ellipse cx="84" cy="23" rx="56" ry="14" fill="#fff4e6" opacity=".22"/>
  </g>
  <g transform="translate(556 272) rotate(-24)">
    <path d="M0 0 C45 2 86 20 113 48 C124 60 115 77 100 75 C80 72 60 59 43 50 C26 41 4 38 0 26 Z" fill="url(#f-skin)"/>
    <path d="M108 44 C123 34 139 39 140 51 C141 63 125 71 111 63" fill="url(#f-skin)"/>
    <g fill="none" stroke="#c9865c" stroke-width="2" opacity=".45"><path d="M27 13 C38 25 48 36 60 42"/></g>
  </g>

  <!-- steam -->
  <g fill="none" stroke="#ffe9cf" stroke-width="7" stroke-linecap="round" opacity=".25">
    <path d="M248 196 C230 166 252 146 238 116"/>
    <path d="M326 176 C308 142 330 122 316 92"/>
    <path d="M412 196 C396 166 416 146 404 118"/>
    <path d="M490 230 C474 200 494 180 482 152"/>
  </g>

  <!-- forks and glass -->
  <g transform="translate(610 180) rotate(12)" fill="#b6a68f">
    <rect x="-5" y="-100" width="10" height="190" rx="5"/>
    <g transform="translate(0 -140)">
      <rect x="-15" y="-48" width="7" height="70" rx="3.5"/><rect x="-4" y="-54" width="7" height="76" rx="3.5"/>
      <rect x="7" y="-48" width="7" height="70" rx="3.5"/><rect x="18" y="-40" width="6" height="62" rx="3"/>
    </g>
  </g>
  <g transform="translate(90 476) rotate(-6)">
    <ellipse cx="0" cy="72" rx="44" ry="15" fill="#2a1308" opacity=".3" filter="url(#f-soft)"/>
    <path d="M-35 -62 L-27 62 Q0 78 27 62 L35 -62 Z" fill="#d9e0d2" opacity=".65" stroke="#e9eee1" stroke-width="2"/>
    <ellipse cx="0" cy="-62" rx="35" ry="12" fill="#eef2e8" opacity=".9"/>
    <path d="M-24 -40 C-19 0 -16 34 -14 50" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".6"/>
  </g>

  <!-- crumbs -->
  <g fill="#cf8e50" opacity=".55">
    <circle cx="512" cy="644" r="3.4"/><circle cx="556" cy="660" r="2.6"/><circle cx="298" cy="654" r="3"/><circle cx="652" cy="422" r="2.4"/>
  </g>

  <rect width="800" height="800" filter="url(#f-noise)" opacity=".6"/>
</svg>
